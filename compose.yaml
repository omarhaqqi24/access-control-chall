services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: uap-access-control-ctf:local
    ports:
      - "${CTF_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      CTF_FLAG: ${CTF_FLAG:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).read(1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
